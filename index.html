<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>跃然 (StylePop) · 261 种手绘风格探索池</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/styles-data.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand-zone">
      <span class="brand-title">跃然 <span class="brand-en">StylePop</span></span>
      <span class="brand-divider" aria-hidden="true">·</span>
      <span class="brand-tagline">一种想法，很多种样子。</span>
    </div>
    <div class="header-indicator">261 风格探索池</div>
  </header>

  <main id="world" aria-label="手绘风格探索池">
    <section class="search">
      <label for="query" class="search-title">今天，想表达什么？</label>
      <div class="input-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="query" maxlength="600" autocomplete="off" spellcheck="false" placeholder="试试「一个人下班后走在雨里」">
        <button id="clear" aria-label="清空关键词" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="chips" id="chips" aria-label="灵感关键词推荐">
        <button type="button" class="chip" data-q="一个人的周末">一个人的周末</button>
        <button type="button" class="chip" data-q="周一早高峰">周一早高峰</button>
        <button type="button" class="chip" data-q="把复杂讲简单">把复杂讲简单</button>
        <button type="button" class="chip" data-q="下班后的雨夜">下班后的雨夜</button>
        <button type="button" class="chip" data-q="给朋友的祝福">给朋友的祝福</button>
        <button type="button" class="chip" data-q="想慢一点">想慢一点</button>
      </div>
      <div class="status-row">
        <p id="status" role="status">输入主题，让合适的风格跳出来。</p>
        <span id="elapsed" class="elapsed" hidden aria-live="polite"></span>
      </div>
    </section>

    <div id="balls"></div>
    <div id="ball-tooltip" class="ball-tooltip" hidden></div>
    <span class="pool-label">跃然 · 261 种手绘风格探索池</span>
  </main>

  <aside id="detail" hidden aria-label="风格详情">
    <div class="detail-sheet-bar" aria-hidden="true"></div>
    <button id="close" aria-label="关闭风格详情">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="detail-head">
      <div class="avatar-frame">
        <img id="avatar" alt="">
      </div>
      <div class="detail-meta">
        <span id="style-id">STYLE / ---</span>
        <span id="style-group" class="style-group">分类</span>
      </div>
    </div>

    <h1 id="style-name">风格名称</h1>

    <div id="style-author-wrap" class="style-author-wrap" hidden>
      <span class="meta-label">参考作者 / 风格源</span>
      <span id="style-author" class="style-author"></span>
    </div>

    <div class="traits-block">
      <span class="traits-label">视觉语言与特征</span>
      <p id="traits"></p>
    </div>

    <details id="preview-details">
      <summary>
          <span>查看生成示例</span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </summary>
      <div class="preview-img-wrap">
        <img id="preview" alt="个人头像生成示例" loading="lazy">
      </div>
    </details>

    <button id="copy">
      <svg class="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span id="copy-text">复制提示词</span>
    </button>
    <p class="copy-hint">主题沿用输入原文；如工具支持参考图，可附上当前风格图。</p>
  </aside>

  <div id="toast" role="status">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toast-text">已复制提示词</span>
  </div>
</body>
</html>
